# gitleaks config: the default ruleset plus narrow allowlists for the FAKE secrets that tests feed into the code on
# purpose and the documented placeholders. Every allowance needs BOTH a path and an EXACT value (condition = AND), so a
# different value in the same file, or the same value in another file, is still reported.
title = "prior gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "fake connection strings used by the redaction and error-path tests (exact values)"
condition = "AND"
paths = [
  '''control_api/tests/test_analytics_extra\.py''',
  '''control_api/tests/test_close_time\.py''',
  '''control_api/tests/test_pull_data\.py''',
  '''control_api/tests/test_security_regressions\.py''',
]
regexes = [
  '''mongodb://u:p@h\b''',
  '''mongodb\+srv://user:pw@x\b''',
  '''mongodb\+srv://u:pw@host\b''',
  '''mongodb\+srv://u:pw@h/x''',
  '''mongodb://user:pw@h/db''',
]

[[allowlists]]
description = "fake PEM headers in the redaction tests (exact strings, one allowance per file)"
condition = "AND"
paths = ['''control_api/tests/test_analytics_extra\.py''']
regexes = ['''private_key="-----BEGIN PRIVATE KEY-----"''']

[[allowlists]]
description = "fake PEM block in the pull-data redaction test"
condition = "AND"
paths = ['''control_api/tests/test_pull_data\.py''']
regexes = ['''-----BEGIN RSA PRIVATE KEY-----x-----END RSA PRIVATE KEY-----''']

[[allowlists]]
description = "invalid PEM used to prove the loader never echoes a key"
condition = "AND"
paths = ['''control_api/tests/test_webpush\.py''']
regexes = ['''-----BEGIN PRIVATE KEY-----\\nnope\\n-----END PRIVATE KEY-----''']

[[allowlists]]
description = "RFC 8291 section 5 published test vector (public example keys, auth secret, salt)"
condition = "AND"
paths = ['''control_api/tests/test_webpush\.py''']
regexes = [
  '''yfWPiYE-n46HLnH0KqZOF1fJJU3MYrct3AELtAQ-oRw''',
  '''q1dXpw3UpT5VOmu_cf_v6ih07Aems3njxI-JWgLcM94''',
  '''BTBZMqHH6r4Tts7J_aSIgg''',
  '''DGv6ra1nlYgDCS1FRnbzlw''',
]

[[allowlists]]
description = "placeholders in the env template and setup notes (angle-bracket forms only)"
condition = "AND"
paths = ['''deploy/env\.example''', '''deploy/.*\.md''', '''render\.yaml''']
regexes = [
  '''mongodb\+srv://<[^>]+>:<[^>]+>@''',
  '''-----BEGIN RSA PRIVATE KEY-----\\n<demo-key-body>\\n-----END RSA PRIVATE KEY-----''',
]

[[allowlists]]
description = "fake token the hook tests feed in on purpose (exact value, one path)"
condition = "AND"
paths = ['''scripts/tests/test_hooks\.py''']
regexes = ['''zq7\-plum\-ferret''']

[[allowlists]]
description = "fake secret used to prove logs never leak it"
condition = "AND"
paths = ['''control_api/tests/test_queue_position_extra\.py''']
regexes = ['''PRIVATE-KEY-SECRET-123''']
